baseURL = "https://dallasai.club/"
locale = "en-US"
title = "Dallas College AI Club"
timeZone = "America/Chicago"
buildFuture = false
buildDrafts = false
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true
[params]
  description = "Student-led AI Club at Dallas College: articles, projects, events, experiments and browser games."
[markup.goldmark.renderer]
  unsafe = true
[outputs]
  home = ["HTML"]
  section = ["HTML"]

[[module.mounts]]
  source = "static"
  target = "static"
[[module.mounts]]
  source = "backend/lib/event-format.mjs"
  target = "static/app/event-format.js"
[[module.mounts]]
  source = "backend/surveys/availability-ui.js"
  target = "static/app/availability-ui.js"
[[module.mounts]]
  source = "backend/surveys/availability-values.js"
  target = "static/app/availability-values.js"
[[module.mounts]]
  source = "backend/surveys/availability.css"
  target = "static/app/availability.css"
