{{ define "main" }}
<header class="page-hero">
  <div class="page-hero-content">
    <h1>Events</h1>
  </div>
  <div class="page-hero-image">📅</div>
</header>
<section class="page-section">
  <h1>Upcoming Events</h1>
  <div class="event-page-wrapper">
    <section class="events section-container">
      <div class="event-list">
        {{ range first 20 (sort (where .Site.RegularPages "Section" "events")
        "Date" "desc") }}
        <div class="event-item">
          <div class="event-date">
            <span class="day">{{ .Date.Format "02" }}</span>
            <span class="month">{{ .Date.Format "Jan" }}</span>
            <span class="time">{{ .Date.Format "03:04 PM" }}</span>
          </div>
          <div class="event-details">
            <h4><a href="{{ .RelPermalink }}">{{ .Title }}</a></h4>
            <p>{{ .Summary }}</p>
          </div>
          <div class="event-arrow">
            <a href="{{ .RelPermalink }}">→</a>
          </div>
        </div>
        {{ end }}
      </div>
    </section>
  </div>
</section>
{{ end }}
